name: Android Release APK

# Builds the signed release APK for a version tag and attaches it to the GitHub
# Release, which the self-hosted F-Droid repo (deranjer/fdroid) picks up daily.
#
# Cookira releases are made by pushing a vMAJOR.MINOR.PATCH tag (see README), so
# this runs on the same tag push as the Docker image workflow. It creates the
# GitHub Release if there isn't one yet. Can also be dispatched by hand to
# (re)build the APK for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (e.g. v0.2.0)
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build & attach signed APK
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Derive versionName / versionCode from the tag
        id: ver
        run: |
          V="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$V"
          PA=${PA%%-*}               # drop any prerelease suffix (e.g. 1.2.0-beta.1)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release APK
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Create the GitHub Release if it doesn't exist
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            FLAGS=""
            case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $FLAGS
          fi

      - name: Attach APK to the release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "cookira-${{ steps.ver.outputs.name }}.apk"
          gh release upload "$TAG" "cookira-${{ steps.ver.outputs.name }}.apk" --repo "$GITHUB_REPOSITORY" --clobber
