name: Android Checks

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-*.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-*.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - run: chmod +x ./gradlew
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace
